name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: 'file:../data/app.db'
      WA_DRIVER: 'mock'
      TZ: 'Asia/Jakarta'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # storage/ di-.gitignore, jadi foto/PDF/DOCX demo tidak ikut checkout.
      # Smoke test butuh file itu → dibuat ulang di runner.
      - name: Generate demo fixtures
        run: pnpm fixtures

      - name: Prepare database
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: API smoke test
        run: |
          pnpm start &
          npx --yes wait-on --timeout 60000 http://127.0.0.1:3000/api/health
          pnpm smoke
