name: Deploy

# Deploy otomatis ke VPS HANYA setelah CI ("verify: Typecheck · Test · Build")
# sukses pada branch main. Bisa juga dijalankan manual dari tab Actions.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Hanya jalan bila CI sukses, atau bila dipicu manual.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Siapkan SSH key
        run: |
          set -eu
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "❌ Secret VPS_HOST / VPS_USER belum diisi."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Secret VPS_SSH_KEY kosong."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "✅ Key disiapkan"

      - name: Diagnosa koneksi SSH
        run: |
          set -eu
          echo "Menguji TCP ke VPS:${VPS_PORT}…"
          if ! timeout 20 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${VPS_PORT}"; then
            echo "❌ TCP ke ${VPS_HOST}:${VPS_PORT} gagal."
            echo "   Periksa: firewall VPS (port ${VPS_PORT} terbuka?), atau secret VPS_PORT salah."
            exit 1
          fi
          echo "✅ TCP terbuka"
          echo "Menguji login SSH…"
          if ! ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
                -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
                -o IdentitiesOnly=yes -o BatchMode=yes \
                "$VPS_USER@$VPS_HOST" 'echo "✅ Login SSH OK"; uname -srm'; then
            echo "❌ Login SSH gagal (exit 255)."
            echo "   Periksa: VPS_SSH_KEY (kunci publik sudah dipasang di ~/.ssh/authorized_keys?),"
            echo "            VPS_USER (harus user yang memiliki kunci itu), VPS_PORT."
            exit 1
          fi

      - name: Tarik kode & rebuild container di VPS
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/sigap

          echo "::notice::Disk sebelum: $(df -h / | tail -1 | awk '{print $4" bebas dari "$2}')"

          # Image baru (~3,8 GB dengan PaddleOCR) butuh ruang; cache build lama
          # dan image yang tidak terpakai dibersihkan dulu agar git fetch/build
          # tidak gagal karena disk penuh.
          docker builder prune -f >/dev/null 2>&1 || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "::notice::Disk sesudah prune: $(df -h / | tail -1 | awk '{print $4" bebas dari "$2}')"

          # Repo bisa tertinggal milik user lain (mis. pernah dijalankan sebagai
          # root), sehingga git fetch gagal menulis objek baru.
          echo "::notice::id=$(id -un) sudo=$(sudo -n true 2>/dev/null && echo yes || echo no) objects=$(stat -c '%U:%G %a' .git/objects 2>/dev/null || echo '?')"
          if ( : > .git/objects/.dsh-probe ) 2>/dev/null; then
            rm -f .git/objects/.dsh-probe
            echo "::notice::.git/objects bisa ditulis"
          else
            echo "::warning::.git/objects TIDAK bisa ditulis"
          fi
          if ( : > .git/objects/pack/.dsh-probe ) 2>/dev/null; then
            rm -f .git/objects/pack/.dsh-probe
            echo "::notice::.git/objects/pack bisa ditulis"
          else
            echo "::warning::.git/objects/pack TIDAK bisa ditulis"
          fi
          echo "::notice::path tak writable: $(find .git -maxdepth 3 ! -writable 2>/dev/null | head -5 | tr '\n' ' ')"
          chmod -R u+rwX .git 2>/dev/null || true
          sudo -n chown -R "$(id -u):$(id -g)" .git 2>/dev/null || true
          echo "::notice::Setelah perbaikan: $(stat -c '%U:%G %a' .git/objects 2>/dev/null || echo '?')"

          if ! git fetch --prune origin 2>/tmp/sigap-git.err; then
            echo "::error::git fetch gagal: $(tr '\n' ' ' < /tmp/sigap-git.err | cut -c1-400)"
            exit 1
          fi
          git reset --hard origin/main
          echo "   commit: $(git rev-parse --short HEAD)"

          echo "→ Membangun & menjalankan container…"
          if ! docker compose up -d --build >/tmp/sigap-build.log 2>&1; then
            echo "::error::docker build gagal: $(tail -n 8 /tmp/sigap-build.log | tr '\n' ' ' | cut -c1-600)"
            tail -n 20 /tmp/sigap-build.log || true
            exit 1
          fi
          tail -n 5 /tmp/sigap-build.log || true

          echo "→ Membersihkan image lama…"
          docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true

          echo "→ Status container…"
          docker compose ps
          REMOTE

      - name: Verifikasi health endpoint
        run: |
          set -eu
          for i in $(seq 1 40); do
            if curl -fsS "http://${VPS_HOST}:3000/api/health" >/dev/null 2>&1; then
              echo "✅ Health check OK"
              curl -s "http://${VPS_HOST}:3000/api/health"
              exit 0
            fi
            echo "menunggu container siap… ($i/40)"
            sleep 5
          done
          echo "❌ Health check gagal: http://${VPS_HOST}:3000/api/health"
          exit 1
