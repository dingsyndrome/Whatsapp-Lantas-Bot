services:
  sigap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigap-wa-command-center
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:/data/app.db"
      STORAGE_DIR: "/app/storage"
      WA_SESSION_PATH: "/data/wa-session"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
      CORS_ORIGIN: "http://localhost:3000"
      TZ: "Asia/Jakarta"
      SEED_DEMO: "${SEED_DEMO:-true}"
    volumes:
      - ./data:/data
      - ./storage:/app/storage
    shm_size: "1gb"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
